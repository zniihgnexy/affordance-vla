# VLA Pipeline v3, figure 2 of 3: how the two heads are trained (docs/vla/2026-11-19_VLA_branch_Pipeline_v3.md).
# Purple dashed boxes are what v3 adds and is not implemented yet; everything else runs today.
# Crops: a real LIBERO-Object demonstration (scripts/report/pipeline_figure_crops.py, README.md in this folder).
figure:
  id: v3_training
  venue: generic
  width: 530
  font: helvetica
  type_scale: 1.1
  pptx_app: office

layout: col
gap: 9

panels:
  - id: band_a
    title: "① 交互 map 头：从夹爪和物体的交互学“哪个、哪里、什么方向”（VLM 冻结）"
    title_align: left
    frame: dashed
    pad: 6
    padt: 20
    body:
      - col:
          gap: 8
          align: start
          body:
            - row:
                gap: 12
                align: center
                body:
                  - {id: img_demo, shape: image, w: 46, src: scene_train.png, caption: "示范的一帧"}
                  - col:
                      gap: 3
                      align: center
                      body:
                        - {id: m_vlm, shape: marker, kind: frozen, d: 7}
                        - {id: vlm, shape: trapezoid, text: "Qwen3-VL-4B", role: neutral}
                  - col:
                      gap: 3
                      align: center
                      body:
                        - {id: m_plan, shape: marker, kind: trainable, d: 7}
                        - {id: planhead, text: "交互 map 头\n含语义先验", role: encoder}
                  - group:
                      id: pred
                      frame: none
                      body:
                        - col:
                            gap: 4
                            align: center
                            body:
                              - {id: p_cell, text: "交互分数 · 深度", role: decoder, minw: 84}
                              - {id: p_ori, text: "方向场", fill: purple.light, dash: true}
                              - {id: p_glob, text: "事件 · 接近方向", role: decoder}
                  - group:
                      id: loss
                      frame: none
                      body:
                        - col:
                            gap: 4
                            align: center
                            body:
                              - {id: l_ce, text: "交叉熵：交互分数、事件", role: loss}
                              - {id: l_hub, text: "Huber：偏移、深度", role: loss}
                              - {id: l_ori, text: "方向场：接触区域内的 L2", fill: purple.light, dash: true}
                              - {id: l_dir, text: "余弦距离：接近方向", role: loss}
            - row:
                gap: 12
                align: center
                body:
                  - {id: traj, text: "示范记录\n夹爪位姿 · 开合", role: input}
                  - {id: contact, text: "L1：抓取时刻的夹爪位姿\n+ 物体分割图", role: neutral}
                  - group:
                      id: labels
                      frame: none
                      body:
                        - col:
                            gap: 4
                            align: center
                            body:
                              - {id: proj, text: "投影到画面：接触区域 · 深度", role: neutral}
                              - {id: g_ori, text: "L2：按类别的标准 map（带方向）", fill: purple.light, dash: true}

  - id: band_b
    title: "② 动作头：反事实监督，计划变了动作就得跟着变（本工作的核心）"
    title_pos: inside-bottom
    title_align: left
    frame: dashed
    fill: orange.pale
    pad: 6
    padt: 8
    body:
      - row:
          gap: 8
          align: center
          body:
            - {id: orig, text: "同一帧画面\n+ 示范的计划", role: neutral}
            - group:
                id: move
                frame: none
                body:
                  - col:
                      gap: 4
                      align: center
                      body:
                        - {id: mv_shift, text: "挪位置（18 cm 内）", role: core}
                        - {id: mv_other, text: "换成另一个物体", role: core}
                        - {id: mv_rel, text: "换释放点", role: core}
                        - {id: mv_rot, text: "转朝向", fill: purple.light, dash: true}
            - group:
                id: relabel
                frame: none
                body:
                  - col:
                      gap: 4
                      align: center
                      body:
                        - {id: rl_path, text: "前段：绕起点旋转缩放", role: core}
                        - {id: rl_tail, text: "末段：该物体自己的接近", role: core}
                        - {id: rl_rot, text: "动作的旋转一起改写", fill: purple.light, dash: true}
            - {id: img_cf, shape: image, w: 46, src: counterfactual.png, caption: "黑：示范  橙：改写"}
            - col:
                gap: 3
                align: center
                body:
                  - {id: m_act, shape: marker, kind: trainable, d: 7}
                  - {id: aloss, text: "动作损失\nflow matching", role: loss}
            - {id: upd, text: "更新：计划编码器\n+ DiT 的 LoRA", role: decoder}

  - id: s_key
    frame: none
    body:
      - row:
          gap: 5
          align: center
          body:
            - {id: k1, shape: marker, kind: trainable, d: 6}
            - {id: k1t, shape: text, text: "训练", type: annot}
            - {id: k2, shape: marker, kind: frozen, d: 6}
            - {id: k2t, shape: text, text: "冻结（主对比时全量微调）", type: annot}
            - {id: k3, shape: sharpbox, w: 11, h: 7, fill: purple.light, dash: true}
            - {id: k3t, shape: text, text: "v3 新增，尚未实现", type: annot}

edges:
  - {from: img_demo.e, to: vlm.w}
  - {from: vlm.e, to: planhead.w}
  - {from: planhead.e, to: pred.w}
  - {from: pred.e, to: loss.w}
  - {from: traj.e, to: contact.w}
  - {from: contact.e, to: labels.w}
  - {from: labels.e, to: loss.s, label: "标签", label_size: 7, label_dx: 4}
  - {from: orig.e, to: move.w, color: core}
  - {from: move.e, to: relabel.w, color: core}
  - {from: relabel.e, to: img_cf.w, color: core}
  - {from: img_cf.e, to: aloss.w, color: core}
  - {from: aloss.e, to: upd.w, color: core}

caption: >-
  \textbf{两个头分开训练：计划头学会从画面读出计划，动作头学会服从计划。}
  ① 交互 map 头在冻结的 VLM 特征上训练；标签来自夹爪和物体的交互：L1 用示范里抓取那一刻的夹爪位姿和物体分割图，投影到画面得到接触区域、深度和闭合方向；L2 把同一类物体的所有抓取放到物体坐标系里叠加成标准 map，再按物体位姿投影到每一帧（物体位姿只用来生成标签和评测，测试时不输入模型）。
  ② 动作头用反事实样本训练：画面不变，把计划挪到别处（挪位置、换成另一个物体、换释放点，v3 加上转朝向），动作标签按挪过的计划改写（15 日的规则：前半段绕起点旋转缩放，最后一段取该物体自己示范里的接近，v3 加上旋转），用 flow matching 损失只更新计划编码器和 DiT 的 LoRA。
  橙色是本工作的核心，紫色虚线框是 v3 新增、尚未实现的部分。
