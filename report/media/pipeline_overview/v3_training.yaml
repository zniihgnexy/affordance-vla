# VLA Pipeline v3, figure 2 of 3: how the two heads are trained (docs/vla/2026-11-19_VLA_branch_Pipeline_v3.md).
# Purple dashed boxes are what v3 adds and is not implemented yet; everything else runs today.
# Crops: a real LIBERO-Object demonstration (scripts/report/pipeline_figure_crops.py, README.md in this folder).
figure:
  id: v3_training
  venue: generic
  width: 530
  font: helvetica
  type_scale: 1.1
  pptx_app: office

layout: col
gap: 9

panels:
  - id: band_a
    title: "① Interaction map head: which object, where, which direction (VLM frozen)"
    title_align: left
    frame: dashed
    pad: 6
    padt: 20
    body:
      - col:
          gap: 8
          align: start
          body:
            - row:
                gap: 12
                align: center
                body:
                  - {id: img_demo, shape: image, w: 46, src: scene_train.png, caption: "demo frame"}
                  - col:
                      gap: 3
                      align: center
                      body:
                        - {id: m_vlm, shape: marker, kind: frozen, d: 7}
                        - {id: vlm, shape: trapezoid, text: "Qwen3-VL-4B", role: neutral}
                  - col:
                      gap: 3
                      align: center
                      body:
                        - {id: m_plan, shape: marker, kind: trainable, d: 7}
                        - {id: planhead, text: "interaction map\nhead + gate", role: encoder}
                  - group:
                      id: pred
                      frame: none
                      body:
                        - col:
                            gap: 4
                            align: center
                            body:
                              - {id: p_cell, text: "score (all objects) · depth", role: decoder, minw: 84}
                              - {id: p_ori, text: "direction field", fill: purple.light, dash: true}
                              - {id: p_glob, text: "event · approach", role: decoder}
                  - group:
                      id: loss
                      frame: none
                      body:
                        - col:
                            gap: 4
                            align: center
                            body:
                              - {id: l_ce, text: "CE: cell / all objects · event", role: loss, minw: 120}
                              - {id: l_hub, text: "Huber: offset, depth", role: loss}
                              - {id: l_ori, text: "MSE: direction in contacts", fill: purple.light, dash: true}
                              - {id: l_dir, text: "cosine: approach", role: loss}
            - row:
                gap: 12
                align: center
                body:
                  - {id: traj, text: "demonstrations\n+ simulator object\nposes (ORACLE)", role: input}
                  - {id: contact, text: "now (g1): object position\n+ mean demo grasp offset", role: neutral}
                  - group:
                      id: labels
                      frame: none
                      body:
                        - col:
                            gap: 4
                            align: center
                            body:
                              - {id: proj, text: "projected: cell · offset · depth", role: neutral}
                              - {id: g_ori, text: "v3: 3D canonical maps (L2, L2c)\nprojected onto every object", fill: purple.light, dash: true}

  - id: band_b
    title: "② Action head: counterfactuals, move the plan and the action label follows (core)"
    title_pos: inside-bottom
    title_align: left
    frame: dashed
    fill: orange.pale
    pad: 6
    padt: 8
    body:
      - row:
          gap: 8
          align: center
          body:
            - {id: orig, text: "same frame\n+ demo plan", role: neutral}
            - group:
                id: move
                frame: none
                body:
                  - col:
                      gap: 4
                      align: center
                      body:
                        - {id: mv_shift, text: "shift (≤ 18 cm)", role: core}
                        - {id: mv_other, text: "other object", role: core}
                        - {id: mv_rel, text: "other release point", role: core}
                        - {id: mv_rot, text: "rotate", fill: purple.light, dash: true}
            - group:
                id: relabel
                frame: none
                body:
                  - col:
                      gap: 4
                      align: center
                      body:
                        - {id: rl_path, text: "start: rotate, scale", role: core}
                        - {id: rl_tail, text: "end: its own approach", role: core}
                        - {id: rl_rot, text: "rotation relabelled", fill: purple.light, dash: true}
            - {id: img_cf, shape: image, w: 46, src: counterfactual.png, caption: "black: demo, orange: new"}
            - col:
                gap: 3
                align: center
                body:
                  - {id: m_act, shape: marker, kind: trainable, d: 7}
                  - {id: aloss, text: "flow matching\n+ 0.2 path loss", role: loss}
            - {id: upd, text: "updates: plan\nencoder, LoRA,\ndecoder MLP", role: decoder}

  - id: s_key
    frame: none
    body:
      - row:
          gap: 5
          align: center
          body:
            - {id: k1, shape: marker, kind: trainable, d: 6}
            - {id: k1t, shape: text, text: "trained", type: annot}
            - {id: k2, shape: marker, kind: frozen, d: 6}
            - {id: k2t, shape: text, text: "frozen (fine-tuned in the main run)", type: annot}
            - {id: k3, shape: sharpbox, w: 11, h: 7, fill: purple.light, dash: true}
            - {id: k3t, shape: text, text: "added by v3, not built yet", type: annot}

edges:
  - {from: img_demo.e, to: vlm.w}
  - {from: vlm.e, to: planhead.w}
  - {from: planhead.e, to: pred.w}
  - {from: pred.e, to: loss.w}
  - {from: traj.e, to: contact.w}
  - {from: contact.e, to: labels.w}
  - {from: labels.e, to: loss.s, label: "labels", label_size: 7, label_dx: -22}
  - {from: orig.e, to: move.w, color: core}
  - {from: move.e, to: relabel.w, color: core}
  - {from: relabel.e, to: img_cf.w, color: core}
  - {from: img_cf.e, to: aloss.w, color: core}
  - {from: aloss.e, to: upd.w, color: core}

caption: >-
  \textbf{The two heads train separately: the map head learns to read the plan from the image, the action head
  learns to obey the plan.}
  ① The interaction map head trains on frozen VLM features. Today (g1) its contact label is the ORACLE contact: the
  simulator object position plus the mean grasp offset of that object's demonstrations, projected to a cell, an
  offset and a depth. v3 replaces it with 3D canonical maps (L2 per mesh, built; L2c per category, planned) projected
  onto every object in view; object poses are used for labels and evaluation only, never as model input.
  ② The action head trains on counterfactual samples: the same frame with the plan moved (shift, other object,
  other release point; v3 adds a rotation), and the action label rewritten to the moved plan (the early part rotated
  and scaled about the start, the last part copied from that object's own approach). Flow matching plus a 0.2-weighted
  path loss updates only the plan encoder, the DiT's LoRA and the action decoder MLP.
  Orange: the core of this work. Purple dashed: added by v3, not implemented yet.
