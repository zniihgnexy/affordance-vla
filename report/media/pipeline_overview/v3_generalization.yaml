# VLA Pipeline v3, figure 3 of 3: where generalisation comes from and how failures are traced
# (docs/vla/2026-11-19_VLA_branch_Pipeline_v3.md). Purple dashed: added by v3, not implemented yet.
# Crops: first frames of a real demonstration and two real LIBERO-PRO rollouts, the named object outlined
# (scripts/report/pipeline_figure_crops.py --scene, README.md in this folder).
figure:
  id: v3_generalization
  venue: generic
  width: 530
  font: helvetica
  type_scale: 1.1
  pptx_app: office

layout: col
gap: 9

panels:
  - id: band_a
    title: "① Zero-shot testing: the scene or the instruction is unseen in training"
    title_align: left
    frame: dashed
    pad: 6
    padt: 20
    body:
      - row:
          gap: 14
          align: center
          body:
            - group:
                id: train
                frame: solid
                pad: 6
                title: "train"
                title_pos: inside-top
                body:
                  - {id: img_train, shape: image, w: 54, src: scene_train.png, caption: "LIBERO-Object"}
            - group:
                id: test
                frame: solid
                pad: 6
                title: "test (zero-shot): LIBERO-PRO"
                title_pos: inside-top
                body:
                  - row:
                      gap: 14
                      align: start
                      body:
                        - {id: img_swap, shape: image, w: 54, src: scene_swap.png, caption: "position perturbation"}
                        - {id: img_task, shape: image, w: 54, src: scene_task.png, caption: "task perturbation"}
                        - col:
                            gap: 5
                            align: center
                            body:
                              - {id: lan, text: "language perturbation\nsame task, reworded", fill: purple.light, dash: true}
                              - {id: later, text: "G3 rotation ±45°\nG4 unseen shapes · G5 mixed\nLIBERO-10, Spatial, Plus", fill: purple.light, dash: true}

  - id: band_c
    title: "② One part per change: which (gate), where and direction (map), how to move (action head)"
    title_align: left
    frame: dashed
    pad: 6
    padt: 20
    padb: 22
    body:
      - row:
          gap: 12
          align: center
          body:
            - {id: offline, text: "offline first-frame check\nobject ID rate · all objects\nposition · direction error", role: neutral}
            - {id: closed, text: "closed loop: LIBERO-PRO\ndev: 20 starts\nreport: 50 × 3 seeds", role: neutral}
            - col:
                gap: 6
                align: center
                body:
                  - group:
                      id: gen
                      frame: region
                      fill: blue.pale
                      pad: 5
                      title: "map + gate: must generalise"
                      title_pos: inside-top
                      body:
                        - col:
                            gap: 4
                            align: center
                            body:
                              - {id: f_obj, text: "wrong object → semantic gate", fill: purple.light, dash: true}
                              - {id: f_pos, text: "position off → score, depth, features", role: encoder}
                              - {id: f_ori, text: "wrong direction → direction field + 3D map", fill: purple.light, dash: true}
                  - group:
                      id: obey
                      frame: region
                      fill: orange.pale
                      pad: 5
                      title: "action head: only obeys"
                      title_pos: inside-top
                      body:
                        - col:
                            gap: 4
                            align: center
                            body:
                              - {id: f_obey, text: "plan not followed → action labels", role: core}
                              - {id: f_after, text: "fails after the grasp → release labels", role: core}

  - id: s_key
    frame: none
    body:
      - row:
          gap: 5
          align: center
          body:
            - {id: k3, shape: sharpbox, w: 11, h: 7, fill: purple.light, dash: true}
            - {id: k3t, shape: text, text: "added by v3, not built yet", type: annot}

edges:
  - {from: train.e, to: test.w}
  - {from: offline.e, to: closed.w}
  - {from: closed.e, to: gen.w}
  - {from: closed.e, to: obey.w}
  - {from: obey.s, to: offline.s, route: bus, bend: 10, color: grey, label: "fix that module, then back to the offline check",
     label_size: 7, label_dy: -5}

caption: >-
  \textbf{Generalisation rests on the interaction affordance map: it turns an unseen scene into the right plan, and
  the action head, trained to obey plans, then acts correctly.}
  ① Training uses standard LIBERO-Object only (the salad-dressing demo; the named object is outlined in orange).
  Testing is zero-shot on LIBERO-PRO: the position perturbation moves the salad dressing, the task perturbation
  names the tomato sauce in the same scene; v3 adds the language perturbation, LIBERO-10 for objects with handles,
  and the tests G3 (rotation), G4 (unseen shapes of a known category, a final goal) and G5 (combined).
  ② A grasp splits into three parts: the semantic gate picks the named object, the interaction map finds the contact
  and direction on every object (blue), the action head only obeys (orange). Each change is checked offline on first
  frames, then in closed loop; every failed episode is assigned to one class and the matching module is fixed.
  Purple dashed: added by v3, not implemented yet.
