# VLA Pipeline v3, figure 1 of 3: the model at test time (docs/vla/2026-11-19_VLA_branch_Pipeline_v3.md).
# Purple dashed boxes are what v3 adds and is not implemented yet; everything else runs today.
# Crops: real LIBERO-PRO rollout (scripts/report/pipeline_figure_crops.py, README.md in this folder).
figure:
  id: v3_model
  venue: generic
  width: 530
  font: helvetica
  type_scale: 1.1
  pptx_app: office

layout: col
gap: 9

panels:
  - id: band_a
    title: "① Perception: the frozen VLM reads image and instruction, once per action chunk"
    title_align: left
    frame: dashed
    pad: 6
    padt: 20
    body:
      - row:
          gap: 14
          align: center
          body:
            - {id: img_in, shape: image, w: 48, src: input.png, caption: "agent view 224×224"}
            - {id: instr, text: "instruction\n“pick up the …”", role: input}
            - col:
                gap: 3
                align: center
                body:
                  - {id: m_vlm, shape: marker, kind: frozen, d: 7}
                  - {id: vlm, shape: trapezoid, text: "Qwen3-VL-4B\n36 layers", role: neutral}
            - group:
                id: tok
                frame: none
                body:
                  - row:
                      gap: 8
                      align: center
                      body:
                        - {id: cells, shape: tokengrid, rows: 8, cols: 8, cell: 3.2, cellgap: 0.4,
                           role: encoder, caption: "8×8 cells"}
                        - {id: itok, shape: slab, n: 6, cell: 4, cellh: 16, role: input, caption: "text tokens"}

  - id: band_b
    title: "② Interaction map head: every object · where · which direction"
    title_pos: inside-bottom
    title_align: left
    frame: dashed
    pad: 6
    padt: 17
    body:
      - row:
          gap: 12
          align: center
          body:
            - col:
                gap: 4
                align: center
                body:
                  - {id: mix, text: "weighted mix of\nVLM layers → 512-d", role: encoder}
                  - {id: fine, text: "finer features\n(pre-merge, 16×16)", fill: purple.light, dash: true}
            - col:
                gap: 3
                align: center
                body:
                  - {id: m_plan, shape: marker, kind: trainable, d: 7}
                  - {id: enc, text: "2-layer Transformer\ncells see the instruction", role: encoder}
            - group:
                id: outs
                frame: none
                body:
                  - col:
                      gap: 4
                      align: center
                      body:
                        - {id: cell, text: "score (all objects) · offset · depth", role: decoder, minw: 150}
                        - {id: orient, text: "direction field: closing axis", fill: purple.light, dash: true}
                        - {id: glob, text: "global: event · approach", role: decoder}
            - {id: sem, text: "semantic gate\nlearned projection\nsimilarity × score", fill: purple.light, dash: true, align_y: cell}

  - id: band_c
    title: "③ Plan → action: the action head only follows the plan"
    title_align: left
    frame: dashed
    pad: 6
    padt: 20
    body:
      - row:
          gap: 9
          align: center
          body:
            - {id: decode, text: "gated peak\n→ 3D contact\n+ gripper pose", role: neutral}
            - {id: plan, text: "plan vector\n10-d (16-d\nplanned)", role: encoder}
            - {id: hold, text: "plan hold\nuntil the\ngripper event", role: neutral}
            - col:
                gap: 3
                align: center
                body:
                  - {id: m_act, shape: marker, kind: trainable, d: 7}
                  - {id: penc, text: "plan encoder\nMLP, added to\naction tokens", role: decoder}
            - {id: act, text: "action head\n(DiT) reads\nVLM layers", role: decoder}
            - {id: chunk, text: "8-step chunk\nOSC controller", role: neutral}
            - {id: img_out, shape: image, w: 46, src: outcome.png, caption: "outcome"}

  - id: s_key
    frame: none
    body:
      - row:
          gap: 5
          align: center
          body:
            - {id: k1, shape: marker, kind: trainable, d: 6}
            - {id: k1t, shape: text, text: "trained", type: annot}
            - {id: k2, shape: marker, kind: frozen, d: 6}
            - {id: k2t, shape: text, text: "frozen (fine-tuned in the main run)", type: annot}
            - {id: k3, shape: sharpbox, w: 11, h: 7, fill: purple.light, dash: true}
            - {id: k3t, shape: text, text: "added by v3, not built yet", type: annot}

edges:
  - {from: img_in.e, to: instr.w}
  - {from: instr.e, to: vlm.w}
  - {from: vlm.e, to: tok.w}
  - {from: vlm.s, to: mix.n}
  - {from: tok.s, to: sem.n, color: purple}
  - {from: mix.e, to: enc.w}
  - {from: fine.e, to: enc.w, color: purple}
  - {from: enc.e, to: outs.w}
  - {from: sem.w, to: cell.e, color: purple}
  - {from: outs.s, to: decode.n, mid: 0.95}
  - {from: decode.e, to: plan.w}
  - {from: plan.e, to: hold.w}
  - {from: hold.e, to: penc.w}
  - {from: penc.e, to: act.w}
  - {from: act.e, to: chunk.w}
  - {from: chunk.e, to: img_out.w}

caption: >-
  \textbf{At test time the interaction affordance map says which object, where to touch and how to orient the
  gripper; it is decoded into a plan vector and the action head only follows that plan.}
  ① The frozen Qwen3-VL-4B reads the agent view and the instruction; each image becomes 8×8 cell tokens.
  ② The interaction map head mixes all VLM layers and gives every cell an interaction score, an offset and a depth,
  plus the next gripper event and the approach direction. v3 scores every object, adds a direction field (gripper
  closing axis, 180°-symmetric) and a semantic gate (learned projection of instruction and cell tokens) that picks
  the named object; the running version is the 8×8 head without direction field or gate.
  ③ The gated peak becomes a 3D contact through the camera calibration; with the approach direction and the event
  it forms the plan vector (10-d; 16-d with the target orientation, planned), held until the gripper event; the plan
  encoder adds it to every action token of the DiT action head, whose 8-step chunk is executed by the OSC controller.
  Purple dashed: added by v3, not implemented yet.
