# VLA Pipeline v3, figure 1 of 3: the model at test time (docs/vla/2026-11-19_VLA_branch_Pipeline_v3.md).
# Purple dashed boxes are what v3 adds and is not implemented yet; everything else runs today.
# Crops: real LIBERO-PRO rollout (scripts/report/pipeline_figure_crops.py, README.md in this folder).
figure:
  id: v3_model
  venue: generic
  width: 530
  font: helvetica
  type_scale: 1.1
  pptx_app: office

layout: col
gap: 9

panels:
  - id: band_a
    title: "① 感知：冻结的 VLM 读画面和指令（每个动作块之后用新画面再查询一次）"
    title_align: left
    frame: dashed
    pad: 6
    padt: 20
    body:
      - row:
          gap: 14
          align: center
          body:
            - {id: img_in, shape: image, w: 48, src: input.png, caption: "智能体视角 224×224"}
            - {id: instr, text: "指令文本\n“pick up the …”", role: input}
            - col:
                gap: 3
                align: center
                body:
                  - {id: m_vlm, shape: marker, kind: frozen, d: 7}
                  - {id: vlm, shape: trapezoid, text: "Qwen3-VL-4B\n36 层", role: neutral}
            - group:
                id: tok
                frame: none
                body:
                  - row:
                      gap: 8
                      align: center
                      body:
                        - {id: cells, shape: tokengrid, rows: 8, cols: 8, cell: 3.2, cellgap: 0.4,
                           role: encoder, caption: "画面格子 token 8×8"}
                        - {id: itok, shape: slab, n: 6, cell: 4, cellh: 16, role: input, caption: "指令 token"}

  - id: band_b
    title: "② 交互 map 头：所有物体 · 哪里 · 什么方向"
    title_pos: inside-bottom
    title_align: left
    frame: dashed
    pad: 6
    padt: 17
    body:
      - row:
          gap: 12
          align: center
          body:
            - col:
                gap: 4
                align: center
                body:
                  - {id: mix, text: "VLM 各层加权平均\n投影到 512 维", role: encoder}
                  - {id: fine, text: "合并前的细特征\n每边 16 块", fill: purple.light, dash: true}
            - col:
                gap: 3
                align: center
                body:
                  - {id: m_plan, shape: marker, kind: trainable, d: 7}
                  - {id: enc, text: "2 层 Transformer\n格子能读到指令", role: encoder}
            - group:
                id: outs
                frame: none
                body:
                  - col:
                      gap: 4
                      align: center
                      body:
                        - {id: cell, text: "交互分数（所有物体）· 偏移 · 深度", role: decoder, minw: 158}
                        - {id: orient, text: "方向场：夹爪闭合方向", fill: purple.light, dash: true}
                        - {id: glob, text: "全局：事件 · 接近方向", role: decoder}
            - {id: sem, text: "语义门控\n指令 × 格子相似度\n乘到交互分数上", fill: purple.light, dash: true, align_y: cell}

  - id: band_c
    title: "③ 计划 → 动作：动作头只按计划走"
    title_align: left
    frame: dashed
    pad: 6
    padt: 20
    body:
      - row:
          gap: 9
          align: center
          body:
            - {id: decode, text: "门控后的峰值\n→ 3D 接触点\n+ 夹爪朝向", role: neutral}
            - {id: plan, text: "计划向量\n16 维", role: encoder}
            - {id: hold, text: "计划保持\n到夹爪动作完成", role: neutral}
            - col:
                gap: 3
                align: center
                body:
                  - {id: m_act, shape: marker, kind: trainable, d: 7}
                  - {id: penc, text: "计划编码器 MLP\n加到每个动作 token", role: decoder}
            - {id: act, text: "动作头 DiT\n读 VLM 特征\nflow matching", role: decoder}
            - {id: chunk, text: "动作块 8 步\nOSC 控制器", role: neutral}
            - {id: img_out, shape: image, w: 46, src: outcome.png, caption: "执行结果"}

  - id: s_key
    frame: none
    body:
      - row:
          gap: 5
          align: center
          body:
            - {id: k1, shape: marker, kind: trainable, d: 6}
            - {id: k1t, shape: text, text: "训练", type: annot}
            - {id: k2, shape: marker, kind: frozen, d: 6}
            - {id: k2t, shape: text, text: "冻结（主对比时全量微调）", type: annot}
            - {id: k3, shape: sharpbox, w: 11, h: 7, fill: purple.light, dash: true}
            - {id: k3t, shape: text, text: "v3 新增，尚未实现", type: annot}

edges:
  - {from: img_in.e, to: instr.w}
  - {from: instr.e, to: vlm.w}
  - {from: vlm.e, to: tok.w}
  - {from: vlm.s, to: mix.n}
  - {from: tok.s, to: sem.n, color: purple}
  - {from: mix.e, to: enc.w}
  - {from: fine.e, to: enc.w, color: purple}
  - {from: enc.e, to: outs.w}
  - {from: sem.w, to: cell.e, color: purple}
  - {from: outs.s, to: decode.n, mid: 0.95}
  - {from: decode.e, to: plan.w}
  - {from: plan.e, to: hold.w}
  - {from: hold.e, to: penc.w}
  - {from: penc.e, to: act.w}
  - {from: act.e, to: chunk.w}
  - {from: chunk.e, to: img_out.w}

caption: >-
  \textbf{测试时，交互 affordance map 给出“认对哪个、接触哪里、夹爪朝哪个方向”，解码成 16 维计划，动作头只按这个计划生成动作。}
  ① 冻结的 Qwen3-VL-4B 读智能体视角和指令，每张图得到 8×8 个格子 token。
  ② 交互 map 头读 VLM 各层特征和视觉编码器合并前的更细特征，每个点给出交互分数、偏移、深度和方向场（夹爪闭合方向，转 180° 算同一方向），另给出下一个夹爪事件和接近方向。交互分数对画面里所有物体都画；语义门控把指令和每个格子的相似度变成权重，乘到交互分数上，挑出点名的物体。现在运行的是它的第一版：8×8 格子，没有方向场。
  ③ 门控后的峰值经相机标定得到 3D 接触点，峰值处的闭合方向和接近方向给出夹爪朝向，和事件一起组成 16 维计划（到接触点的距离 6 维、接近方向 3 维、朝向 6 维、事件 1 维），保持到夹爪动作完成；计划编码器把它加到动作头每个动作 token 上，动作头（读 VLM 特征）生成 8 步动作，由 OSC 控制器执行。物体朝向在第二阶段用 3D 对齐读出，图中未画。
  紫色虚线框是 v3 新增、尚未实现的部分。
