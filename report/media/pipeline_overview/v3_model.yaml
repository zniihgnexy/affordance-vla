# VLA Pipeline v3, figure 1 of 3: the model at test time (docs/vla/2026-11-19_VLA_branch_Pipeline_v3.md).
# Same structure and detail as detail/v3_detail_1_overview.png. Colours from paper.yaml: gold = the open-source
# starVLA QwenPI model with its released weights; orange = ours, trained; grey = ours, no weights; purple dashed =
# planned, not built yet. Circled numbers: the links between starVLA and our parts (week-2 review, section 2.2).
# Crops: one real LIBERO-PRO rollout (scripts/report/pipeline_figure_crops.py; wrist.png is its wrist view).
paper: paper.yaml
figure:
  id: v3_model
  width: 820
  pptx_app: office

layout: col
gap: 8

panels:
  - id: s_main
    frame: none
    body:
      - row:
          gap: 16
          align: start
          body:
            - col:
                id: c_in
                gap: 7
                align: center
                body:
                  - {id: agent, shape: image, w: 54, src: input.png, caption: "agent view 224×224"}
                  - {id: wrist, shape: image, w: 54, src: wrist.png, caption: "wrist view 224×224"}
                  - {id: instr, text: "**instruction**\n“pick up the\nsalad dressing …”", role: input}
                  - {id: state, text: "**robot state 7-d**\nnot sent: off in\nstarVLA training", role: input, dash: true}
            - group:
                id: g_vlm
                title: "starVLA QwenPI: VLM"
                fill: gold.pale
                pad: 7
                body:
                  - row:
                      gap: 12
                      align: start
                      body:
                        - col:
                            gap: 10
                            align: center
                            body:
                              - {id: vit, text: "**vision encoder (ViT)**\n24 layers · 2×2 merge\n8×8 = 64 tokens per view\nlayers 5/11/17 → LLM 1–3", role: backbone}
                              - {id: prompt, text: "**prompt template**\n“Your task is …”", role: backbone}
                        - {id: llm, text: "**language model**\nQwen3-VL-4B\n36 layers × 2560\ncausal, images first\nall 36 layers kept", role: backbone, minh: 150}
            - col:
                id: c_mid
                gap: 14
                align: center
                body:
                  - row:
                      gap: 10
                      align: end
                      body:
                        - group:
                            id: g_aff
                            title: "affordance map (ours)"
                            fill: orange.pale
                            pad: 6
                            body:
                              - row:
                                  gap: 12
                                  align: center
                                  body:
                                    - col:
                                        gap: 8
                                        align: center
                                        body:
                                          - {id: maphead, text: "**M2 map head g1**\n7.9M parameters, trained\nreads all 36 LLM layers\n+ the instruction\nper cell: score · offset · depth\nglobal: event · approach", role: core}
                                          - {id: mapext, text: "**v3 map head**\nscore on every object\n+ closing direction per cell", fill: purple.light, dash: true}
                                    - col:
                                        gap: 6
                                        align: center
                                        body:
                                          - {id: map_now, shape: image, w: 50, src: map_now.png, caption: "now: 64 cell scores"}
                                          - {id: map_v3, shape: image, w: 50, src: map_v3.png, caption: "v3: every object + axis"}
                        - {id: gate, text: "**M1 semantic gate**\ninstruction–cell\nsimilarity × score\n→ the named object", fill: purple.light, dash: true}
                  - group:
                      id: g_dit
                      title: "starVLA QwenPI: action head"
                      fill: gold.pale
                      pad: 7
                      body:
                        - col:
                            gap: 6
                            align: center
                            body:
                              - {id: dit_in, text: "noisy actions 8×7 → 8 tokens\n+ our plan embedding", role: backbone}
                              - {id: dit_blk, text: "**DiT block i**\n36 blocks × 2560\ncross-attends LLM layer i\n+ our LoRA (rank 16)", role: backbone}
                              - {id: dit_dec, text: "decoder → velocity\n4 flow-matching steps", role: backbone}
            - col:
                id: c_plan
                gap: 10
                align: center
                body:
                  - {id: decode, text: "**decode to a 3D contact**\ncell + offset → pixel\ndepth along the camera ray\n(planned: + gripper pose)", role: neutral}
                  - {id: plan, text: "**plan vector**\n10 numbers\nreach / 10 cm · tanh(reach / 2 cm)\napproach 3 · event 1\n(planned: + orientation → 16)", role: neutral}
                  - {id: hold, text: "**plan hold**\none contact per phase", role: neutral}
                  - {id: penc, text: "**plan encoder**\n1.6M parameters, trained\nMLP 10 → 512 → 512 → 2560\nlast layer starts at zero", role: core}
                  - {id: actions, text: "**8 actions × 7**\nΔpos · Δrot · gripper\nde-normalised (starVLA)\nOSC at 20 Hz (LIBERO)", role: neutral}
            - col:
                id: c_out
                gap: 0
                align: center
                body:
                  - {id: outcome, shape: image, w: 54, src: outcome.png, caption: "outcome"}

  - id: s_key
    frame: none
    body:
      - row:
          gap: 5
          align: center
          body:
            - {id: k1, shape: sharpbox, w: 11, h: 7, fill: gold.light}
            - {id: k1_s, shape: spacer, w: 3, h: 4}
            - {id: k1t, shape: text, text: "starVLA QwenPI (open source): released weights, frozen", type: annot}
            - {id: k2, shape: sharpbox, w: 11, h: 7, fill: orange.light}
            - {id: k2_s, shape: spacer, w: 3, h: 4}
            - {id: k2t, shape: text, text: "ours, trained", type: annot}
            - {id: k3, shape: sharpbox, w: 11, h: 7, fill: grey.pale}
            - {id: k3_s, shape: spacer, w: 3, h: 4}
            - {id: k3t, shape: text, text: "ours, no weights", type: annot}
            - {id: k4, shape: sharpbox, w: 11, h: 7, fill: purple.light, dash: true}
            - {id: k4_s, shape: spacer, w: 3, h: 4}
            - {id: k4t, shape: text, text: "planned", type: annot}
            - {id: k_gap, shape: spacer, w: 8, h: 4}
            - {id: k5t, shape: text, text: "①–⑥ links between starVLA and ours", type: annot}

edges:
  - {from: agent.e, to: vit.w, label: "①"}
  - {from: wrist.e, to: vit.w}
  - {from: instr.e, to: prompt.w, label: "②"}
  - {from: vit.e, to: llm.w}
  - {from: prompt.e, to: llm.w}
  - {from: llm.e, to: g_aff.w, label: "④", label_pos: 0.9}
  - {from: llm.e, to: dit_blk.w}
  - {from: maphead.e, to: map_now.w}
  - {from: map_now.e, to: decode.w, label: "best cell → contact"}
  - {from: mapext.e, to: map_v3.w, color: purple, dash: true}
  - {from: map_v3.e, to: gate.w, color: purple, dash: true}
  - {from: gate.e, to: decode.w, color: purple, dash: true}
  - {from: decode.s, to: plan.n}
  - {from: plan.s, to: hold.n}
  - {from: hold.s, to: penc.n}
  - {from: penc.w, to: dit_in.e, label: "⑤ plan"}
  - {from: dit_dec.e, to: actions.w, label: "⑥"}
  - {from: actions.e, to: outcome.w}

notes:
  - {text: "③", near: state.e, dx: 5}

caption: >-
  \textbf{At test time our map head and plan pathway sit around the open-source starVLA QwenPI model, which runs with
  its released weights.} The VLM (Qwen3-VL-4B) reads both camera views and the instruction and keeps the hidden
  states of all 36 layers; the map head scores the 8×8 cells of the agent view, the best cell is decoded into a 3D
  contact and a 10-number plan, held until the gripper event, and the plan encoder adds it to the action tokens of
  starVLA's flow-matching action head, whose block i reads LLM layer i. Gold: starVLA, released weights, frozen;
  orange: ours, trained; grey: ours, no weights; purple dashed: planned (semantic gate, scores on every object,
  direction field, gripper orientation). ①–⑥: images, instruction and robot state in; VLM layers out to our map
  head; our plan in; actions out.
