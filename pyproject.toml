[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "affordance-vla"
version = "0.1.0"
description = "Counterfactual affordance supervision for vision-language-action policies (research code)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["affordance_vla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# dash (pulled in by open3d) registers a pytest plugin that emits deprecation noise
addopts = "-p no:dash"

[tool.ruff]
line-length = 120
target-version = "py310"
# notebooks are generated by scripts/report/build_*.py, which are linted instead
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# notebook builders hold the notebooks' Markdown as long string literals
"scripts/report/build_*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["affordance_vla"]
