# AFFO-16 base policy: starVLA QwenOFT (Qwen3-VL-4B + MLP regression head, L1 loss) with LoRA on the language-model
# layers, trained together with the action head, on the PRETRAIN split of eight atomic RoboCasa365 tasks
# (MimicGen + human demonstrations; configs/rc365/data_registry_affo16). One card, bf16, DeepSpeed ZeRO-2.
# `framework.lora` is read by scripts/rc365/train_lora_launcher.py (starVLA itself ignores it).
# Paths are relative to the starVLA checkout and overridden on the command line by scripts/rc365/run_train_base_gpu.sh.
run_id: qwenoft_lora_rc365_8tasks
run_root_dir: results/Checkpoints
seed: 42
is_debug: false
trackers: [jsonl]

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
  lora:
    rank: 16
    alpha: 32
  action_model:
    action_model_type: MLP
    action_dim: 12
    state_dim: 16
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false      # the model is fed three cameras and the instruction, no state (as the starVLA example)
    data_root_dir: playground/Datasets/robocasa365
    data_mix: affo16_rc365_pretrain_8tasks
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av

trainer:
  max_train_steps: 30000
  num_warmup_steps: 500
  save_interval: 2500
  eval_interval: 100000000
  learning_rate:
    base: 1.0e-04
    qwen_vl_interface: 2.0e-04     # only the adapters train here
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ""               # the launcher freezes the VLM weights and keeps the adapters trainable
  is_resume: true                  # continue from the latest checkpoint of this run folder after a queue restart
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  logging_frequency: 10
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
