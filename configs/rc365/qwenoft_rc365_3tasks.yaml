# starVLA QwenOFT (Qwen3-VL-4B + MLP regression head, L1 loss) on three RoboCasa365 PandaOmron tasks: the recipe of
# starVLA's own RoboCasa365 example (examples/simBenchmarks/Robocasa_365), three tasks instead of one.
# Pipeline check only (AFFO-10): a few hundred steps. Frozen VLM by default; the full fine-tune is the same file
# with `--trainer.freeze_modules ""` (see scripts/rc365/run_train_gpu.sh, FREEZE=).
# Paths are relative to the starVLA checkout and overridden on the command line by the wrapper.
run_id: qwenoft_rc365_3tasks
run_root_dir: results/Checkpoints
seed: 42
is_debug: false
trackers: [jsonl]

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    action_model_type: MLP
    action_dim: 12
    state_dim: 16
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets/robocasa365
    data_mix: affo10_rc365_3tasks      # CoffeeSetupMug + OpenDrawer + TurnOffStove (configs/rc365/data_registry)
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av

trainer:
  max_train_steps: 300
  num_warmup_steps: 20
  save_interval: 300
  eval_interval: 100000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  logging_frequency: 10
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
